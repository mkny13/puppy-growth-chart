name: CI

# Runs on every PR, and is reused by deploy.yml so that nothing deploys from
# main unless verification and the dependency audit pass. No secrets are needed.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --audit-level=high
      - run: npm run verify
